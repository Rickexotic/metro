<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Club Metro | Outside Commercial Proposal
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>

<body>

    <!-- ==========================================
         INTRO EXPERIENCE
    =========================================== -->

    <section
        id="intro"
        class="intro-screen"
    >

        <div class="intro-content">

            <!-- SEARCH -->

            <div class="search-wrapper">

                <div
                    id="searchBar"
                    class="search-bar"
                >

                    <svg
                        class="search-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                    >
                        <circle
                            cx="11"
                            cy="11"
                            r="7"
                        ></circle>

                        <path
                            d="M20 20L17 17"
                        ></path>

                    </svg>

                    <span
                        id="typedText"
                    ></span>

                </div>

            </div>

            <!-- LOGO -->

            <div
                id="logoStage"
                class="logo-stage"
            >

                <img
                    id="outsideLogo"
                    class="outside-logo"
                    src="assets/outside-logo-black.png"
                    alt="Outside"
                >

            </div>

            <!-- MODE SELECTION -->

            <div
                id="introActions"
                class="intro-actions"
            >

                <button
                    id="autoMode"
                    class="intro-button"
                    type="button"
                >

                    <img
                        src="iconos/play-circle.svg"
                        alt=""
                    >

                    <span>

                        Auto

                    </span>

                </button>

                <button
                    id="manualMode"
                    class="intro-button"
                    type="button"
                >

                    <img
                        src="iconos/hand-index.svg"
                        alt=""
                    >

                    <span>

                        Manual

                    </span>

                </button>

            </div>

        </div>

    </section>

    <!-- ==========================================
         AUDIO
    =========================================== -->

    <audio
        id="typingAudio"
        preload="auto"
        src="assets/typing.m4a"
    >
    </audio>

    <audio
        id="ambientAudio"
        preload="auto"
        loop
        src="assets/2.m4a"
    >
    </audio>

    <!-- ==========================================
         PROGRESS
    =========================================== -->

    <div class="progress-container">

        <div
            id="progressBar"
            class="progress-bar"
        >
        </div>

    </div>

    <!-- ==========================================
         NAVIGATION
    =========================================== -->

    <aside
        id="sideNav"
        class="side-nav"
    >

        <!-- PLAY / PAUSE -->

        <button
            id="presentationMode"
            class="nav-pill"
            type="button"
            aria-label="Play Pause"
        >

            <img
                id="presentationModeIcon"
                src="iconos/pause-circle.svg"
                alt=""
            >

        </button>

        <!-- CAPSULE -->

        <div
            class="nav-capsule"
        >

            <button
                id="goPrevious"
                class="nav-arrow"
                type="button"
                aria-label="Anterior"
            >

                <img
                    src="iconos/chevron-up.svg"
                    alt=""
                >

            </button>

            <div
                id="pageWindow"
                class="page-window"
            >

                <!-- JS -->

            </div>

            <button
                id="goNext"
                class="nav-arrow"
                type="button"
                aria-label="Siguiente"
            >

                <img
                    src="iconos/chevron-down.svg"
                    alt=""
                >

            </button>

        </div>

        <!-- AUDIO -->

        <button
            id="audioToggle"
            class="nav-pill"
            type="button"
            aria-label="Audio"
        >

            <img
                id="audioIcon"
                src="iconos/volume-2.svg"
                alt=""
            >

        </button>

        <!-- THEME -->

        <button
            id="themeToggle"
            class="nav-pill"
            type="button"
            aria-label="Theme"
        >

            ☾

        </button>

    </aside>

    <!-- ==========================================
         SLIDES
    =========================================== -->

    <main
        id="slidesContainer"
        class="slides-container"
    >

        <!--
        Slides renderizadas
        desde data/content.json
        -->

    </main>

    <!-- ==========================================
         CLOSING ACTIONS
    =========================================== -->

    <div
        id="presentationActions"
        class="presentation-actions"
    >

        <button
            id="pdfBtn"
            class="action-btn"
            type="button"
        >

            PDF

        </button>

        <button
            id="saveBtn"
            class="action-btn"
            type="button"
        >

            Save

        </button>

        <div class="share-wrap">

            <button
                id="shareBtn"
                class="action-btn"
                type="button"
            >

                <img
                    src="iconos/share.svg"
                    alt=""
                >

            </button>

            <div
                id="shareMenu"
                class="share-menu"
            >

                <button
                    id="mailBtn"
                    class="action-btn"
                    type="button"
                >

                    <img
                        src="iconos/mail.svg"
                        alt=""
                    >

                </button>

                <button
                    id="whatsappBtn"
                    class="action-btn"
                    type="button"
                >

                    <img
                        src="iconos/whatsapp.svg"
                        alt=""
                    >

                </button>

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
