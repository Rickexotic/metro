<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Club Metro | Outside Commercial Proposal
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>

<body>

    <!-- ==========================================
         INTRO
    =========================================== -->

    <section
        id="intro"
        class="intro-screen"
    >

        <div class="intro-center">

            <div class="intro-search">

                <svg
                    class="search-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                >
                    <circle
                        cx="11"
                        cy="11"
                        r="7"
                    />

                    <path
                        d="M20 20L17 17"
                    />

                </svg>

                <span
                    id="typedText"
                ></span>

            </div>

            <div class="intro-actions">

                <!-- AUTO -->

                <button
                    id="autoMode"
                    class="intro-mode"
                    type="button"
                >

                    <img
                        src="iconos/play-circle.svg"
                        alt=""
                    >

                    <span>
                        Auto
                    </span>

                </button>

                <!-- MANUAL -->

                <button
                    id="manualMode"
                    class="intro-mode"
                    type="button"
                >

                    <img
                        src="iconos/hand-index.svg"
                        alt=""
                    >

                    <span>
                        Manual
                    </span>

                </button>

            </div>

            <img
                id="outsideLogo"
                class="outside-logo"
                src="assets/outside-logo-black.png"
                alt="Outside"
            >

        </div>

    </section>

    <!-- ==========================================
         AUDIO
    =========================================== -->

    <audio
        id="typingAudio"
        preload="auto"
        src="assets/typing.m4a"
    ></audio>

    <audio
        id="ambientAudio"
        preload="auto"
        loop
        src="assets/2.m4a"
    ></audio>

    <!-- ==========================================
         PROGRESS
    =========================================== -->

    <div class="progress-container">

        <div
            id="progressBar"
            class="progress-bar"
        ></div>

    </div>

    <!-- ==========================================
         NAVIGATION
    =========================================== -->

    <aside
        id="sideNav"
        class="side-nav hidden"
    >

        <!-- PLAY / PAUSE -->

        <button
            id="presentationMode"
            class="nav-control"
            type="button"
            aria-label="Play Pause"
        >

            <img
                id="presentationModeIcon"
                src="iconos/pause-circle.svg"
                alt=""
            >

        </button>

        <!-- CAPSULE -->

        <div class="nav-capsule">

            <button
                id="goPrevious"
                class="presentation-jump"
                type="button"
            >

                <img
                    src="iconos/chevron-up.svg"
                    alt=""
                >

            </button>

            <div
                id="pageWindow"
                class="page-window"
            >

                <!-- JS -->

            </div>

            <button
                id="goNext"
                class="presentation-jump"
                type="button"
            >

                <img
                    src="iconos/chevron-down.svg"
                    alt=""
                >

            </button>

        </div>

        <!-- AUDIO -->

        <button
            id="audioToggle"
            class="nav-control"
            type="button"
        >

            <img
                id="audioIcon"
                src="iconos/volume-2.svg"
                alt=""
            >

        </button>

        <!-- THEME -->

        <button
            id="themeToggle"
            class="nav-control"
            type="button"
        >

            ☾

        </button>

    </aside>

    <!-- ==========================================
         PRESENTATION
    =========================================== -->

    <main
        id="slidesContainer"
        class="slides-container"
    >

        <!-- CONTENT GENERATED
             FROM data/content.json -->

    </main>

    <!-- ==========================================
         ACTIONS
    =========================================== -->

    <div
        id="presentationActions"
        class="presentation-actions hidden"
    >

        <!-- PDF -->

        <button
            id="pdfBtn"
            class="action-btn"
            type="button"
            title="PDF"
        >

            PDF

        </button>

        <!-- SAVE -->

        <button
            id="saveBtn"
            class="action-btn"
            type="button"
            title="Guardar"
        >

            Save

        </button>

        <!-- SHARE -->

        <div class="share-wrap">

            <button
                id="shareBtn"
                class="action-btn"
                type="button"
            >

                <img
                    src="iconos/share.svg"
                    alt=""
                >

            </button>

            <div
                id="shareMenu"
                class="share-menu"
            >

                <button
                    id="mailBtn"
                    class="action-btn"
                    type="button"
                >

                    <img
                        src="iconos/mail.svg"
                        alt=""
                    >

                </button>

                <button
                    id="whatsappBtn"
                    class="action-btn"
                    type="button"
                >

                    <img
                        src="iconos/whatsapp.svg"
                        alt=""
                    >

                </button>

            </div>

        </div>

    </div>

    <!-- ==========================================
         SCRIPT
    =========================================== -->

    <script src="app.js"></script>

</body>

</html>
