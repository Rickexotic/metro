<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Club Metro | Outside Commercial Proposal
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>

<body>

    <!-- PROGRESS -->

    <div class="progress-container">

        <div
            id="progressBar"
            class="progress-bar"
        ></div>

    </div>

    <!-- INTRO -->

    <section
        id="intro"
        class="intro-screen"
    >

        <div class="intro-content">

            <!-- STEP 1 -->

          <div
    id="introSelector"
    class="intro-selector"
>

    <button
        id="autoMode"
        class="intro-button"
        type="button"
    >

        <img
            src="iconos/play-circle.svg"
            alt=""
        >

        <span>

            Auto

        </span>

    </button>

    <button
        id="manualMode"
        class="intro-button"
        type="button"
    >

        <img
            src="iconos/hand-index.svg"
            alt=""
        >

        <span>

            Manual

        </span>

    </button>

</div>
            
            <!-- STEP 2 -->

            <div
                id="searchStage"
                class="search-stage"
            >

                <div class="search-bar">

                    <svg
                        class="search-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                    >

                        <circle
                            cx="11"
                            cy="11"
                            r="7"
                        />

                        <path
                            d="M20 20L17 17"
                        />

                    </svg>

                    <span
                        id="typedText"
                    ></span>

                </div>

            </div>

            <!-- STEP 3 -->

            <div
                id="logoStage"
                class="logo-stage"
            >

                <img
                    id="outsideLogo"
                    class="outside-logo"
                    src="assets/outside-logo-black.png"
                    alt="Outside"
                >

            </div>

        </div>

    </section>

    <!-- AUDIO -->

    <audio
        id="typingAudio"
        preload="auto"
        src="assets/typing.m4a"
    ></audio>

    <audio
        id="ambientAudio"
        preload="auto"
        loop
        src="assets/2.m4a"
    ></audio>

    <!-- NAVIGATION -->

    <aside
        id="sideNav"
        class="side-nav hidden"
    >

        <button
            id="presentationMode"
            class="nav-pill"
            type="button"
        >

           <img
    id="presentationModeIcon"
    src="iconos/play-circle.svg"
    alt=""
>

        </button>

        <div
            class="nav-capsule"
        >

            <button
                id="goPrevious"
                class="nav-arrow"
                type="button"
            >

                <img
                    src="iconos/chevron-up.svg"
                    alt=""
                >

            </button>

            <div
                id="pageWindow"
                class="page-window"
            ></div>

            <button
                id="goNext"
                class="nav-arrow"
                type="button"
            >

                <img
                    src="iconos/chevron-down.svg"
                    alt=""
                >

            </button>

        </div>

           <button
            id="themeToggle"
            class="nav-pill"
            type="button"
        >

          <img
    src="iconos/circle-half.svg"
    alt=""
>

        </button>

    </aside>

    <!-- SLIDES -->

    <main
        id="slidesContainer"
        class="slides-container"
    >

    </main>

    <!-- ACTIONS -->

    <div
        id="presentationActions"
        class="presentation-actions hidden"
    >

        <!-- PDF -->

        <button
            id="pdfBtn"
            class="action-btn"
            type="button"
        >

          <img
    src="iconos/filetype-pdf.svg"
    alt=""
>

        </button>

        <!-- SAVE -->

        <button
            id="saveBtn"
            class="action-btn"
            type="button"
        >

            <img
                src="iconos/download.svg"
                alt=""
            >

        </button>

        <!-- SHARE -->

        <div class="share-wrap">

            <button
                id="shareBtn"
                class="action-btn"
                type="button"
            >

                <img
                    src="iconos/share.svg"
                    alt=""
                >

            </button>

            <div
                id="shareMenu"
                class="share-menu"
            >

                <button
                    id="mailBtn"
                    class="action-btn"
                    type="button"
                >

                    <img
                        src="iconos/mail.svg"
                        alt=""
                    >

                </button>

                <button
                    id="whatsappBtn"
                    class="action-btn"
                    type="button"
                >

                    <img
                        src="iconos/whatsapp.svg"
                        alt=""
                    >

                </button>

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
